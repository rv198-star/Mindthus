name: Bidirectional steelman pilot

on:
  push:
    branches:
      - research/bidirectional-steelman-convergence

permissions:
  contents: write
  models: read

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[run-bsc-pilot]')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL: openai/gpt-5
      PILOT_CASES: bsc-001,bsc-006,bsc-007,bsc-010
      RESULT_DIR: docs/internal/research/results/bsc-github-models-pilot-2026-08-18-1
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run preregistered A/B/C direct-inference pilot
        id: pilot
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          set +e
          overall_rc=0
          for variant in A B C; do
            echo "=== variant $variant ==="
            OUT="$RUNNER_TEMP/bsc-github-models-$variant"
            mkdir -p "$OUT"
            python3 scripts/run-bidirectional-steelman-github-models.py \
              --variant "$variant" \
              --model "$MODEL" \
              --judge-model "$MODEL" \
              --case-ids "$PILOT_CASES" \
              --out-dir "$OUT"
            rc=$?
            if [[ -f "$OUT/$variant.json" ]]; then
              cp "$OUT/$variant.json" "$RESULT_DIR/$variant.json"
            fi
            if [[ $rc -ne 0 ]]; then
              overall_rc=1
              printf '{"variant":"%s","stage":"github_models_experiment","returncode":%s}\n' "$variant" "$rc" > "$RESULT_DIR/$variant.failure.json"
            fi
          done
          echo "returncode=$overall_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build pilot overview
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_DIR"])
          variants = {}
          for variant in "ABC":
              result_path = root / f"{variant}.json"
              failure_path = root / f"{variant}.failure.json"
              if result_path.is_file():
                  result = json.loads(result_path.read_text(encoding="utf-8"))
                  summary = result.get("summary") or {}
                  variants[variant] = {
                      "status": "completed" if summary.get("judged_case_count") else "incomplete",
                      "model": result.get("model"),
                      "judged_case_count": summary.get("judged_case_count"),
                      "positive_behavioral_pass_rate": summary.get("positive_behavioral_pass_rate"),
                      "negative_control_pass_rate": summary.get("negative_control_pass_rate"),
                      "hard_fail_rate": summary.get("hard_fail_rate"),
                      "generation_error_count": summary.get("generation_error_count"),
                      "judge_error_count": summary.get("judge_error_count"),
                  }
              elif failure_path.is_file():
                  variants[variant] = {"status": "failed", "failure_file": failure_path.name}
              else:
                  variants[variant] = {"status": "missing"}

          overview = {
              "schema_version": "mindthus-bsc-github-models-pilot-overview-v0.1",
              "substrate": "github-models-direct-inference",
              "runtime_equivalence_claim": False,
              "model": os.environ["MODEL"],
              "pilot_case_ids": ["bsc-001", "bsc-006", "bsc-007", "bsc-010"],
              "variants": variants,
              "interpretation_boundary": "This pilot compares treatment prompts on an independent direct-inference substrate. It does not certify Codex or ChatGPT Stable runtime behavior.",
          }
          (root / "overview.json").write_text(json.dumps(overview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Persist pilot evidence to research branch
        if: always()
        shell: bash
        run: |
          git config user.name 'mindthus-experiment-bot'
          git config user.email 'mindthus-experiment-bot@users.noreply.github.com'
          git add "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo 'No pilot evidence to commit.'
            exit 0
          fi
          git commit -m 'research: record GitHub Models BSC pilot evidence'
          git push origin HEAD:research/bidirectional-steelman-convergence

      - name: Upload full pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsc-github-models-pilot-full
          path: ${{ runner.temp }}/bsc-github-models-*
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce experiment outcome
        if: always()
        shell: bash
        run: |
          if [[ '${{ steps.pilot.outputs.returncode }}' != '0' ]]; then
            echo 'At least one GitHub Models pilot variant failed.' >&2
            exit 1
          fi
