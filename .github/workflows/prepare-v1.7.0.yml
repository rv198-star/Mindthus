          start = tests.index('    def test_v1_6_0_release_with_supplemental_roi_beta(self):')
          end = tests.index('    def test_v1_4_6_release_surface_is_preserved(self):', start)
          replacement = '''    def test_v1_7_0_release_with_supplemental_roi_beta(self):
