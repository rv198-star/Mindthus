          tests = tests[:start] + replacement + tests[end:]
          write('tests/test_release_boundary_contract.py', tests)

          Path('.github/workflows/prepare-v1.7.0.yml').unlink()
          PY
      - name: Pre-commit validation
        run: |
          python3 -m compileall -q scripts skills tests
          python3 scripts/check-test-lifecycle.py
          python3 -m unittest discover -s tests -q
      - name: Commit prepared release
        run: |
          git config user.name "Mindthus Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): prepare v1.7.0 [release-prepared]"
          git push origin HEAD:release/v1.7.0-prepare
