- ROI.2 implementation / qualification refs 仍然有效且历史 qualification tree 未变；
- runtime delta 不超出声明范围；
- WAE 等非 overlay owner tree 与 Stable 保持一致；
- Beta namespace 与 Stable 隔离；
- runtime diagnostic 在 Beta coordinates 下 strict pass；
- archive 同一 commit 重建时 byte reproducible；
- package profile / capability register 可审计。

这些验证证明构建组成和边界，不证明 ROI Beta 在所有模型或 host 上都优于 Stable。
'''
          write(f'docs/releases/v{BETA}.md', beta_notes)

          tests = read('tests/test_release_boundary_contract.py')
          tests = tests.replace(
              'REPO / "docs" / "releases" / "v1.6.0.md"',
