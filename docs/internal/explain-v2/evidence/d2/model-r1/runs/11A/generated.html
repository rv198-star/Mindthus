<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发期假设：请求验证与返回流程</title>
<style>
:root{color-scheme:light;--ink:#182b3a;--muted:#526371;--line:#cbd6df;--bg:#f3f6f8;--blue:#225f91}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}
main{max-width:960px;margin:auto;padding:32px 24px 40px}
.tag{display:inline-block;margin:0 0 12px;padding:3px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--muted)}
h1{margin:0 0 12px;font-size:clamp(25px,4vw,34px);line-height:1.3}
.lead{margin:0 0 20px;font-size:18px}
.limits{padding:16px 20px;background:#fff7df;border:1px solid #cbb66b;border-radius:10px;margin-bottom:24px}
.limits p{margin:4px 0}
h2{font-size:20px;margin:0 0 12px}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px}
figure{margin:0}
svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;font-family:inherit}
svg text{fill:var(--ink);font-size:14px}
.node{fill:#f2f7fb;stroke:var(--blue);stroke-width:1.5}
.error{fill:#fff5e7;stroke:#946019}
.arrow{fill:none;stroke:#536d81;stroke-width:1.8;marker-end:url(#arrow)}
figcaption{padding-top:12px;border-top:1px solid #e4ebf0;font-size:15px}
details{margin-top:18px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:#fff}
summary{cursor:pointer;font-weight:600}
summary:focus-visible{outline:3px solid var(--blue);outline-offset:5px}
details p{margin:12px 0 0;color:var(--muted)}
@media(max-width:480px){main{padding:22px 16px 30px}.panel{padding:16px 10px}.limits{padding:12px 14px}.lead{font-size:17px}}
</style>
</head>
<body>
<main>
<header>
<p class="tag">开发期假设 / 语义样例</p>
<h1>格式决定请求进入哪条分支</h1>
<p class="lead">用户提交请求后，由验证器检查格式：有效则进入处理器并返回结果；无效则返回错误，用户修正后再提交。</p>
</header>

<section class="limits" aria-label="重要条件与限制">
<p><strong>格式通过不证明内容真实。</strong></p>
<p><strong>处理器不获得额外执行授权。</strong></p>
</section>

<section class="panel" aria-labelledby="flow-heading">
<h2 id="flow-heading">提交、返回与再提交</h2>
<figure>
<svg viewBox="0 0 360 410" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">开发期假设请求流程图</title>
<desc id="diagram-desc">用户提交请求到验证器。格式有效时进入处理器，再将结果返回用户；格式无效时向用户返回错误，用户修正后再提交到验证器。两条返回路径和修正后的再提交路径均用箭头表示。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10Z" fill="#536d81"/>
</marker>
</defs>

<rect class="node" x="105" y="20" width="150" height="50" rx="8"/>
<text x="180" y="50" text-anchor="middle">用户</text>

<path class="arrow" d="M180 70V120"/>
<text x="193" y="101">提交请求</text>

<rect class="node" x="105" y="120" width="150" height="50" rx="8"/>
<text x="180" y="150" text-anchor="middle">验证器：检查格式</text>

<path class="arrow" d="M145 170V193H95V230"/>
<text x="95" y="216" text-anchor="middle">格式有效</text>
<path class="arrow" d="M215 170V193H265V230"/>
<text x="265" y="216" text-anchor="middle">格式无效</text>

<rect class="node" x="30" y="230" width="130" height="50" rx="8"/>
<text x="95" y="260" text-anchor="middle">处理器</text>

<rect class="node error" x="200" y="230" width="130" height="50" rx="8"/>
<text x="265" y="260" text-anchor="middle">向用户返回错误</text>

<path class="arrow" d="M95 280V325"/>
<text x="105" y="307">产生结果</text>
<rect class="node" x="30" y="325" width="130" height="50" rx="8"/>
<text x="95" y="355" text-anchor="middle">结果</text>

<path class="arrow" d="M265 280V325"/>
<rect class="node error" x="200" y="325" width="130" height="50" rx="8"/>
<text x="265" y="355" text-anchor="middle">用户修正请求</text>

<path class="arrow" d="M95 375V395H12V45H105"/>
<text x="22" y="168" transform="rotate(90 22 168)">返回结果给用户</text>

<path class="arrow" d="M265 375V395H348V45H255"/>
<text x="338" y="252" transform="rotate(-90 338 252)">修正后再提交</text>
</svg>
<figcaption>路径说明：用户提交 → 验证器；有效 → 处理器 → 返回结果；无效 → 返回错误 → 用户修正 → 再提交，重新检查格式。</figcaption>
</figure>
</section>

<details>
<summary>如何理解这个示例</summary>
<p>这是开发期假设流程与语义样例，不表示生产进度。流程中的“有效”仅指格式有效；它不证明内容真实，也不赋予处理器额外执行授权。</p>
</details>
</main>
</body>
</html>
