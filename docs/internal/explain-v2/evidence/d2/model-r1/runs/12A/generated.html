<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开发期假设：请求验证与返回流程</title>
<style>
:root{color-scheme:light;--ink:#182733;--muted:#53636e;--line:#cbd6dc;--accent:#205b76;--paper:#fff;--bg:#f3f6f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}
main{max-width:960px;margin:auto;padding:36px 24px 48px}
.tag{display:inline-block;margin:0 0 12px;padding:3px 10px;border:1px solid var(--accent);border-radius:6px;color:var(--accent);font-size:14px;font-weight:650}
h1{margin:0 0 16px;font-size:clamp(25px,4vw,36px);line-height:1.3}
h2{margin:0 0 12px;font-size:20px}
p{margin:0 0 12px}
.conclusion{padding:20px;border-left:5px solid var(--accent);background:var(--paper);border-radius:0 10px 10px 0}
.conclusion p:last-child{margin-bottom:0}
.limits{margin:12px 0 0;padding-left:22px}
.limits li+li{margin-top:5px}
section{margin-top:28px}
figure{margin:0;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
svg{display:block;width:100%;max-width:650px;height:auto;margin:auto}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);font-size:24px}
.node{fill:#f5f8fa;stroke:#78909e;stroke-width:2}
.user{fill:#eaf3f7;stroke:var(--accent)}
.arrow{fill:none;stroke:#536d7b;stroke-width:2.5;marker-end:url(#arrow)}
.branch{font-size:22px;font-weight:650}
figcaption{margin-top:12px;color:var(--muted);font-size:15px}
details{margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
summary{cursor:pointer;font-weight:650}
summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px;border-radius:3px}
details p{margin:12px 0 0;color:var(--muted)}
@media(max-width:480px){main{padding:24px 16px 32px}.conclusion{padding:16px}figure{padding:8px}h2{font-size:19px}}
</style>
</head>
<body>
<main>
<header>
<p class="tag">开发期假设流程 · 语义样例</p>
<h1>格式决定处理分支，错误修正后可再提交</h1>
<div class="conclusion">
<p><strong>格式有效：</strong>请求进入处理器，再向用户返回结果。<br><strong>格式无效：</strong>向用户返回错误；用户修正后再提交。</p>
<ul class="limits">
<li><strong>格式通过不证明内容真实。</strong></li>
<li><strong>处理器不获得额外执行授权。</strong></li>
</ul>
</div>
</header>

<section aria-labelledby="flow-heading">
<h2 id="flow-heading">提交、返回与再提交</h2>
<figure>
<svg viewBox="0 0 620 575" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">开发期假设：请求验证流程</title>
<desc id="diagram-desc">用户提交请求到验证器。格式有效时进入处理器，再向用户返回结果；格式无效时向用户返回错误，用户修正后再提交到验证器。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#536d7b"/>
</marker>
</defs>

<path class="arrow" d="M310 82 V134"/>
<path class="arrow" d="M270 192 V225 H150 V264"/>
<path class="arrow" d="M350 192 V225 H470 V264"/>
<path class="arrow" d="M150 322 V374"/>
<path class="arrow" d="M470 322 V374"/>
<path class="arrow" d="M470 432 V484"/>
<path class="arrow" d="M60 403 H22 V53 H220"/>
<path class="arrow" d="M560 513 H598 V163 H400"/>

<rect class="node user" x="220" y="24" width="180" height="58" rx="10"/>
<text x="310" y="62" text-anchor="middle">用户</text>
<rect class="node" x="220" y="134" width="180" height="58" rx="10"/>
<text x="310" y="172" text-anchor="middle">验证器</text>

<text x="326" y="117">提交请求</text>
<text class="branch" x="150" y="214" text-anchor="middle">格式有效</text>
<text class="branch" x="470" y="214" text-anchor="middle">格式无效</text>

<rect class="node" x="60" y="264" width="180" height="58" rx="10"/>
<text x="150" y="302" text-anchor="middle">处理器</text>
<rect class="node" x="380" y="264" width="180" height="58" rx="10"/>
<text x="470" y="302" text-anchor="middle">返回错误</text>

<rect class="node" x="60" y="374" width="180" height="58" rx="10"/>
<text x="150" y="412" text-anchor="middle">返回结果</text>
<rect class="node user" x="380" y="374" width="180" height="58" rx="10"/>
<text x="470" y="412" text-anchor="middle">用户修正</text>

<rect class="node user" x="380" y="484" width="180" height="58" rx="10"/>
<text x="470" y="522" text-anchor="middle">再提交</text>
</svg>
<figcaption>路径说明：用户提交 → 验证器 → 有效则处理并返回结果；无效则返回错误 → 用户修正 → 再提交到验证器。</figcaption>
</figure>
</section>

<details>
<summary>如何理解这个开发期语义样例</summary>
<p>这里展示的是开发用假设流程，不代表已实现或已验证的生产进度。流程中的“有效”仅指格式有效，不能据此认定内容真实，也不赋予处理器额外执行授权。</p>
</details>
</main>
</body>
</html>
