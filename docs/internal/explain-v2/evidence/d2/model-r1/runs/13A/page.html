<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>请求验证与返回流程 · 开发期假设</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17283b;
    --muted: #526274;
    --line: #cbd5df;
    --blue: #185c91;
    --bg: #f3f6f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.65;
  }
  main { max-width: 960px; margin: auto; padding: 36px 24px 48px; }
  .label { margin: 0 0 8px; color: var(--blue); font-size: 14px; font-weight: 700; }
  h1 { margin: 0 0 16px; font-size: clamp(25px, 4vw, 34px); line-height: 1.3; }
  h2 { margin: 0 0 10px; font-size: 20px; }
  p { margin: 0; }
  .conclusion {
    padding: 20px;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--blue);
    border-radius: 10px;
  }
  .lead { font-size: 18px; font-weight: 650; }
  .limits { margin: 14px 0 0; padding-left: 22px; }
  .limits li + li { margin-top: 5px; }
  section { margin-top: 28px; }
  figure {
    margin: 0;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
  }
  svg { display: block; width: 100%; max-width: 430px; height: auto; margin: auto; }
  svg text { font-family: inherit; fill: var(--ink); font-size: 14px; }
  svg .node { fill: #f6f8fb; stroke: #8496a8; stroke-width: 1.3; }
  svg .valid { fill: #eef6fc; stroke: #3576a6; }
  svg .invalid { fill: #fff5e9; stroke: #9c6c31; }
  svg .arrow { fill: none; stroke: #526274; stroke-width: 1.6; marker-end: url(#arrow); }
  figcaption { margin-top: 16px; color: var(--muted); font-size: 15px; }
  details {
    margin-top: 20px;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  summary { cursor: pointer; font-weight: 650; }
  summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 5px; }
  details p { margin-top: 12px; color: var(--muted); }
  @media (max-width: 480px) {
    main { padding: 24px 16px 32px; }
    .conclusion { padding: 16px; }
    figure { padding: 12px 8px 16px; }
    figcaption { padding: 0 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="label">开发期假设 / 语义样例</p>
    <h1>先验证格式，再按分支返回</h1>
    <div class="conclusion">
      <p class="lead">格式有效：进入处理器并返回结果。格式无效：返回错误，用户修正后再提交。</p>
      <ul class="limits">
        <li><strong>格式通过不证明内容真实。</strong></li>
        <li><strong>处理器不获得额外执行授权。</strong></li>
      </ul>
    </div>
  </header>

  <section aria-labelledby="flow-heading">
    <h2 id="flow-heading">请求如何流转</h2>
    <figure>
      <svg viewBox="0 0 360 530" role="img" aria-labelledby="flow-title flow-description">
        <title id="flow-title">提交、验证、返回与再提交流程</title>
        <desc id="flow-description">用户提交请求到验证器。格式有效时进入处理器，再将结果返回用户；格式无效时向用户返回错误。用户修正后再提交请求到验证器。</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#526274"/>
          </marker>
        </defs>

        <rect class="node" x="105" y="12" width="150" height="44" rx="8"/>
        <text x="180" y="39" text-anchor="middle">用户提交请求</text>
        <path class="arrow" d="M180 56 V100"/>

        <rect class="node" x="105" y="102" width="150" height="48" rx="8"/>
        <text x="180" y="132" text-anchor="middle">验证器：检查格式</text>

        <path class="arrow" d="M140 150 V174 H82 V216"/>
        <path class="arrow" d="M220 150 V174 H266 V216"/>
        <text x="82" y="199" text-anchor="middle">格式有效</text>
        <text x="266" y="199" text-anchor="middle">格式无效</text>

        <rect class="node valid" x="20" y="218" width="124" height="46" rx="8"/>
        <text x="82" y="246" text-anchor="middle">进入处理器</text>
        <rect class="node invalid" x="204" y="218" width="124" height="46" rx="8"/>
        <text x="266" y="246" text-anchor="middle">返回错误给用户</text>

        <path class="arrow" d="M82 264 V306"/>
        <path class="arrow" d="M266 264 V306"/>

        <rect class="node valid" x="20" y="308" width="124" height="46" rx="8"/>
        <text x="82" y="336" text-anchor="middle">返回结果给用户</text>
        <rect class="node invalid" x="204" y="308" width="124" height="46" rx="8"/>
        <text x="266" y="336" text-anchor="middle">用户修正请求</text>

        <path class="arrow" d="M266 354 V396"/>
        <rect class="node" x="204" y="398" width="124" height="46" rx="8"/>
        <text x="266" y="426" text-anchor="middle">再提交请求</text>

        <path class="arrow" d="M266 444 V486 H348 V126 H257"/>
        <text x="177" y="511" text-anchor="middle">再提交 → 回到验证器</text>
      </svg>
      <figcaption>路径说明：提交后先验证格式；有效则处理并返回结果，无效则返回错误，用户修正后再提交到验证器。</figcaption>
    </figure>
  </section>

  <details>
    <summary>这份流程样例的说明范围</summary>
    <p>这是开发期假设流程，用于说明请求的分支和返回路径，不代表生产进度。图中的“有效”仅指格式有效；不能据此确认内容真实，也不能据此赋予处理器额外执行授权。</p>
  </details>
</main>
</body>
</html>
